name: temp-all-document-viewer-v1-3-native
on:
  push:
    branches: [temp-all-document-viewer-v1-3-build]
concurrency:
  group: alldoc-v13-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            alldoc_v13_native/native/hwp_renderer/target
          key: alldoc-v13-hwp-rust-${{ runner.os }}-${{ hashFiles('alldoc_v13_native/native/hwp_renderer/Cargo.toml') }}
      - name: Install host test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfreetype6-dev libfontconfig1-dev
      - name: Fetch public HWP fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/496333b27d21ddb9114ba9ae340bcb895870c9a7/samples/basic/english.hwp' -o /tmp/english.hwp
          test -s /tmp/english.hwp
          echo 'HWP_TEST_FIXTURE=/tmp/english.hwp' >> "$GITHUB_ENV"
      - name: Preflight native document registry
        working-directory: alldoc_v13_native/native/hwp_renderer
        run: rustc --edition 2021 --test tests/document_registry.rs -o /tmp/document_registry_test && /tmp/document_registry_test
      - name: Preflight native render request
        working-directory: alldoc_v13_native/native/hwp_renderer
        run: rustc --edition 2021 --test tests/render_request.rs -o /tmp/render_request_test && /tmp/render_request_test
      - name: Test native HWP renderer
        working-directory: alldoc_v13_native/native/hwp_renderer
        run: cargo test
      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.3.11579264'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Build native HWP renderer
        working-directory: alldoc_v13_native
        run: bash scripts/build_native_hwp.sh
      - name: Verify payload
        run: |
          file alldoc_v13_native/app/src/main/jniLibs/arm64-v8a/libhwp_renderer.so
          file alldoc_v13_native/app/src/main/jniLibs/x86_64/libhwp_renderer.so
      - uses: actions/upload-artifact@v4
        with:
          name: alldoc-v13-native-libs
          path: alldoc_v13_native/app/src/main/jniLibs
